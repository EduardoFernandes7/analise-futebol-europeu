name: Atualizar dados

on:
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira às 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Buscar dados atualizados
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m fetch.build_dataset

      - name: Commitar mudanças, se houver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --staged --quiet || git commit -m "chore: atualizar dados da temporada [skip ci]"
          git push
